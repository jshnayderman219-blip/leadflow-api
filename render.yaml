services:
  - type: web
    name: leadflow
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadflow-crm-db
          property: connectionString

databases:
  - name: leadflow-crm-db
    plan: free
